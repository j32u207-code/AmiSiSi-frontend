<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmiSiSi</title>
  
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="background-image: url('img/Nubes.png'); background-size: cover; background-position: center; background-attachment: fixed;">

  <!-- NAVBAR -->
  <div class="sticky-top bg-body">
    <nav class="navbar navbar-expand-md py-3 border-bottom border-secondary">
      <div class="container-fluid px-4 align-items-center">
        
        <!-- Logo AmiSiSi gigante con borde relleno -->
<a class="navbar-brand text-bg-body logo-principal" href="index.html">AmiSiSi</a>
        
        <div class="d-flex flex-grow-1 align-items-center justify-content-between">
          
          <!-- 2. Barra de búsqueda ampliada (eliminado el max-width: 800px para que ocupe todo lo posible) -->
          <form class="d-flex mx-auto w-100 px-2 px-md-4" role="search">
            <div class="input-group buscador-personalizado rounded-1 overflow-hidden w-100">
              <span class="input-group-text border-0 bg-transparent text-body">
                <i class="bi bi-search"></i>
              </span>
              <input class="form-control border-0 bg-transparent shadow-none text-body" type="search" aria-label="Buscar" placeholder="Buscar productos...">
            </div>
          </form>

          <div class="d-flex align-items-center ms-auto gap-3 gap-md-4">
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-none d-md-block text-nowrap">Modo Oscuro</button>

            <!-- ENLACES -->
            <a href="carrito.html" class="text-body fs-4 text-decoration-none"><i class="bi bi-cart2"></i></a>
            <a href="formulario.html" class="text-body fs-4 text-decoration-none"><i class="bi bi-person"></i></a>
            
            <button class="navbar-toggler border-0 d-block px-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas" aria-controls="menuOffcanvas">
              <span class="navbar-toggler-icon fs-4"></span>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <!-- SECCIÓN PRINCIPAL -->
  <main class="min-vh-100 py-4 py-md-5">
    <div class="container px-4 px-md-5">
      
      <!-- Panel de Colaboración -->
      <div class="fondo-cristal-azul w-100 mb-4 p-4 p-md-5 d-flex flex-column flex-xl-row align-items-center justify-content-between rounded-3">
        <div class="d-flex align-items-center justify-content-center flex-wrap gap-3 gap-md-5 flex-grow-1">
          
          <!-- 3. Texto Ricardo Cavolo cambiado por imagen -->
          <img src="img/cavolo.png" alt="Ricardo Cavolo" class="img-fluid" style="max-height: 150px;">
          
          <img src="img/corazon.png" alt="Corazón Fuego" style="width: 140px; height: auto;">
          
          <!-- 4. La X y AmiSiSi ya usan la fuente Classic Milky a través de la clase custom-font -->
          <h1 class="custom-font m-0 display-4 text-body">X</h1>
          <h1 class="navbar-brand custom-font m-0 me-md-5 text-body lh-1 logo-principal">AmiSiSi</h1>
        </div>
        
        <div class="mt-3 mt-xl-0 ms-xl-5 text-center">
           <img src="img/cavolo-camiseta.png" alt="Camiseta Colaboración" class="img-fluid" style="max-height: 250px;">
        </div>
      </div>

      <!-- Paneles de Categorías -->
      <div class="row g-4 text-center justify-content-center">
        
        <!-- Cazadoras -->
        <div class="col-12 col-md-4">
          <div class="fondo-cristal-azul h-100 p-4 d-flex flex-column align-items-center justify-content-between rounded-3">
            <img src="img/cazadora.png" alt="Cazadora" class="img-fluid mb-4 w-100" style="max-height: 350px; object-fit: contain;">
            <h2 class="custom-font m-0 fs-1 text-body">CAZADORAS</h2>
          </div>
        </div>
        
        <!-- Sudaderas -->
        <div class="col-12 col-md-4">
          <div class="fondo-cristal-azul h-100 p-4 d-flex flex-column align-items-center justify-content-between rounded-3">
            <img src="img/sudadera.png" alt="Sudadera" class="img-fluid mb-4 w-100" style="max-height: 350px; object-fit: contain;">
            <h2 class="custom-font m-0 fs-1 text-body">SUDADERAS</h2>
          </div>
        </div>
        
        <!-- Pantalones -->
        <div class="col-12 col-md-4">
          <div class="fondo-cristal-azul h-100 p-4 d-flex flex-column align-items-center justify-content-between rounded-3">
            <img src="img/pantalon.png" alt="Pantalones" class="img-fluid mb-4 w-100" style="max-height: 350px; object-fit: contain;">
            <h2 class="custom-font m-0 fs-1 text-body">PANTALONES</h2>
          </div>
        </div>
        
      </div>
    </div>
  </main>

  <!-- MENÚ LATERAL OFFCANVAS (Sin cambios) -->
  <div class="offcanvas offcanvas-end text-bg-body" tabindex="-1" id="menuOffcanvas" aria-labelledby="menuOffcanvasLabel" role="dialog">
    <div class="offcanvas-header border-bottom border-secondary">
      <h3 class="offcanvas-title fs-3 text-body" id="menuOffcanvasLabel">AmiSiSi</h3>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
      <ul class="navbar-nav fs-5 w-100">
        <li class="nav-item border-bottom border-secondary-subtle">
          <a class="nav-link px-4 py-3 d-flex align-items-center gap-2" href="index.html"><i class="bi bi-house"></i> Inicio</a>
        </li>
        <li class="nav-item border-bottom border-secondary-subtle"><a class="nav-link px-4 py-3" href="#">Colaboraciones</a></li>
        <li class="nav-item border-bottom border-secondary-subtle"><a class="nav-link px-4 py-3" href="#">Prendas Otoño</a></li>
        <li class="nav-item border-bottom border-secondary-subtle"><a class="nav-link px-4 py-3" href="#">Prendas Invierno</a></li>
        <li class="nav-item border-bottom border-secondary-subtle"><a class="nav-link px-4 py-3" href="#">Prendas Primavera</a></li>
        <li class="nav-item border-bottom border-secondary-subtle"><a class="nav-link px-4 py-3" href="#">Prendas Verano</a></li>
      </ul>
      
      <div class="mt-auto w-100 border-top border-secondary">
        <ul class="navbar-nav fs-5 w-100">
          <li class="nav-item border-bottom border-secondary-subtle">
            <a class="nav-link px-4 py-3 d-flex align-items-center gap-2" href="formulario.html"><i class="bi bi-person"></i> Mi Cuenta</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-4 py-3 text-danger d-flex align-items-center gap-2 fw-semibold" href="#"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
          </li>
        </ul>
        <div class="px-4 pb-4 pt-3 d-md-none">
          <button id="theme-toggle-mobile" class="btn btn-outline-secondary w-100">🌙 Modo Oscuro</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
